[server]
# Bind to localhost only - a reverse proxy (e.g. Caddy) sits in front
host = "127.0.0.1"
port = 3000
# Maximum payload size for package uploads (supports human-readable notation: 100KiB, 512MiB, 1GiB, etc.)
max_payload_size = "512MiB"

[storage]
# Production data path
data_path = "/var/lib/sw1nn-pkg-repo/data"
default_repo = "sw1nn"
default_arch = "x86_64"

# [auth]
# Uncomment to require an Authelia-issued access token on the API endpoints.
# Without this section, all endpoints are publicly accessible.
#
# Every field below has a default matching the live deployment, so an empty
# [auth] section is enough to turn authentication on.
#
# Expected `iss` claim, checked exactly.
# issuer = "https://auth.sw1nn.net"
#
# JWKS endpoint used to verify token signatures offline. Fetched lazily and
# cached; refetched only when a token presents an unknown key id.
# jwks_uri = "https://auth.sw1nn.net/jwks.json"
#
# OIDC client id this service accepts. Tokens minted for any other client are
# rejected. This is the replay boundary between services, because Authelia's
# device grant leaves `aud` empty.
# client_id = "sw1nn-pkg-cli"
#
# Clock leeway applied to `exp` and `nbf`, in seconds.
# leeway_secs = 60
#
# Authorization is by Authelia group, not by anything in this file:
#   list packages                          any valid token
#   upload                                 pkg-publish
#   delete, rebuild, cleanup policy        pkg-admin
